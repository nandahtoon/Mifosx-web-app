name: build-run

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    name: Run Lint, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'

      - name: Remove node_modules
        run: rm -rf node_modules

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve diff base
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
            echo "No prior branch commit supplied; checking the full pushed tree."
          fi

          git cat-file -e "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Run eslint
        run: npx eslint .

      - name: Run stylelint
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.diff.outputs.base_sha }}"
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD)"
          CHANGED_SCSS_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^src/.*\.scss$' || true)"

          if [ -z "$CHANGED_SCSS_FILES" ]; then
            echo "No changed SCSS files to lint"
            exit 0
          fi

          printf '%s\n' "$CHANGED_SCSS_FILES" | xargs npx stylelint

      - name: Run prettier
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.diff.outputs.base_sha }}"
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD)"
          CHANGED_PRETTIER_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.(ts|js|html|css|scss|json|md|yml|yaml)$' || true)"

          if [ -z "$CHANGED_PRETTIER_FILES" ]; then
            echo "No changed files to check with prettier"
            exit 0
          fi

          printf '%s\n' "$CHANGED_PRETTIER_FILES" | xargs npx prettier --check

      - name: Run HTMLHint
        run: npx htmlhint "src" --config .htmlhintrc

      - name: Check file headers
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for MPL-2.0 license headers in changed files..."

          BASE_SHA="${{ steps.diff.outputs.base_sha }}"
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD)"
          RELEVANT_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.(ts|js|html|css|scss)$' | grep -v -E '\.(spec\.ts|spec\.js|d\.ts)$' | grep -v -E '(environment\.ts|environment\.prod\.ts|polyfills\.ts|node_modules)' || true)"

          if [ -z "$RELEVANT_FILES" ]; then
            echo "No relevant files changed"
            exit 0
          fi

          printf '%s\n' "$RELEVANT_FILES" | xargs node scripts/check-file-headers.js

      - name: Run unit tests
        run: npm run test:ci

      - name: Run production build
        run: npm run build:prod

      - name: Upload GitHub Pages build
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-dist-${{ github.sha }}
          path: dist/web-app/browser
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: github-pages-dist-${{ github.sha }}
          path: dist/web-app/browser

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist/web-app/browser
          clean: true
          force: false
          silent: true
