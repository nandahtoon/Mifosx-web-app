name: Publish Image in Docker Hub

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Docker Hub configuration
        id: registry
        shell: bash
        env:
          DOCKER_ORGANIZATION: ${{ secrets.DOCKER_ORGANIZATION }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$DOCKER_ORGANIZATION" ] && [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Docker Hub publication is required on main but registry credentials are not configured."
            exit 1
          fi

          echo "::notice::Docker Hub credentials are not configured; skipping dev image publication."

      - name: Set up QEMU
        if: ${{ steps.registry.outputs.configured == 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ steps.registry.outputs.configured == 'true' }}
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Log in to Docker Hub
        if: ${{ steps.registry.outputs.configured == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract branch name
        if: ${{ steps.registry.outputs.configured == 'true' }}
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"
        id: extract_branch

      - name: Get Git hashes
        if: ${{ steps.registry.outputs.configured == 'true' }}
        run: |
          echo "short_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "long_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: git_hashes

      - name: Build and push multi-arch Docker image
        if: ${{ steps.registry.outputs.configured == 'true' }}
        shell: bash
        env:
          DOCKER_ORGANIZATION: ${{ secrets.DOCKER_ORGANIZATION }}
        run: |
          set -euo pipefail

          TAGS="--tag $DOCKER_ORGANIZATION/web-app:${{ steps.extract_branch.outputs.branch }}"

          if [ "${{ steps.extract_branch.outputs.branch }}" = "main" ]; then
            TAGS="$TAGS --tag $DOCKER_ORGANIZATION/web-app:${{ steps.git_hashes.outputs.short_hash }} --tag $DOCKER_ORGANIZATION/web-app:${{ steps.git_hashes.outputs.long_hash }}"
          else
            TAGS="$TAGS --tag $DOCKER_ORGANIZATION/web-app:${{ steps.extract_branch.outputs.branch }}-${{ steps.git_hashes.outputs.short_hash }}"
          fi

          docker build --push --build-arg="PUPPETEER_SKIP_DOWNLOAD_ARG=true" --platform linux/amd64,linux/arm64 $TAGS .
