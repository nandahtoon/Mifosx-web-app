name: MifosX Web App CI

on:
  pull_request:
    branches:
      - dev
      - feature/**
  push:
    branches:
      - dev
      - feature/**

concurrency:
  group: mifosx-web-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Run production build
        run: npm run build
