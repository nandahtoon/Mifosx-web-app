<a *ngIf="task.route; else staticTask" [routerLink]="task.route" class="task-card task-card-link">
  <div>
    <strong>{{ task.title }}</strong>
    <span>{{ task.meta }}</span>
  </div>
  <em>{{ task.priority }}</em>
</a>

<ng-template #staticTask>
  <div class="task-card">
    <div>
      <strong>{{ task.title }}</strong>
      <span>{{ task.meta }}</span>
    </div>
    <em>{{ task.priority }}</em>
  </div>
</ng-template>
