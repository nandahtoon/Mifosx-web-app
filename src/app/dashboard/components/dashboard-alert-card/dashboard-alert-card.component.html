<a
  *ngIf="alert.route; else staticAlert"
  [routerLink]="alert.route"
  class="alert-card alert-card-link"
  [class.critical]="alert.severity === 'critical'"
  [class.high]="alert.severity === 'high'"
  [class.medium]="alert.severity === 'medium'"
  [class.info]="alert.severity === 'info'"
>
  <strong>{{ alert.title }}</strong>
  <span>{{ alert.description }}</span>
</a>

<ng-template #staticAlert>
  <div
    class="alert-card"
    [class.critical]="alert.severity === 'critical'"
    [class.high]="alert.severity === 'high'"
    [class.medium]="alert.severity === 'medium'"
    [class.info]="alert.severity === 'info'"
  >
    <strong>{{ alert.title }}</strong>
    <span>{{ alert.description }}</span>
  </div>
</ng-template>
