<button
  mat-icon-button
  [matMenuTriggerFor]="themeMenu"
  [matTooltip]="'tooltips.Color Schemes' | translate"
  [attr.aria-label]="'tooltips.Color Schemes' | translate"
>
  <fa-icon icon="fill-drip" size="lg"></fa-icon>
</button>

<mat-menu class="mifosx-theme-picker-menu" #themeMenu="matMenu" x-position="before">
  <mat-grid-list cols="2">
    @for (preset of presets; track preset.id) {
      <mat-grid-tile>
        <button
          mat-menu-item
          type="button"
          (click)="selectPreset(preset)"
          [attr.aria-label]="'labels.branding.presets.' + preset.id + '.name' | translate"
        >
          <div
            class="mifosx-theme-picker-swatch"
            [matTooltip]="'labels.branding.presets.' + preset.id + '.name' | translate"
          >
            @if (activePreset === preset.id) {
              <fa-icon class="mifosx-theme-chosen-icon" icon="check-circle" size="lg"></fa-icon>
            }
            <div class="mifosx-theme-picker-primary" [style.background]="preset.primaryLight"></div>
            <div class="mifosx-theme-picker-accent" [style.background]="preset.accentLight"></div>
          </div>
        </button>
      </mat-grid-tile>
    }
  </mat-grid-list>
</mat-menu>
